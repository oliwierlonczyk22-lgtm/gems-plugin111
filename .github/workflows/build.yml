name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: mvn -B package -f "$(find . -name pom.xml | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: GemPlugin
          path: "**/target/GemPlugin-*.jar"
