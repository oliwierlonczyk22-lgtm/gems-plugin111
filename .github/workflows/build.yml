name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
            - run: mvn -B package
        working-directory: GemPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: GemPlugin
          path: GemPlugin/target/*.jar
